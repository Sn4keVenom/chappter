<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover so the safe-area insets used by the mobile nav
         resolve to real values on notched phones in standalone/PWA mode. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="description" content="Chappter — chapter operations platform" />
    <!-- Painted by ThemeProvider once the resolved theme is known, so the
         browser chrome matches the header instead of flashing white. -->
    <meta name="theme-color" content="#25405E" />
    <!-- Home-screen / PWA install: manifest drives Android + desktop Chrome,
         the apple-touch-icon + apple-mobile-web-app-* tags drive iOS Safari
         (which does not read the manifest's icons for "Add to Home Screen"). -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Chappter" />
    <title>Chappter</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
